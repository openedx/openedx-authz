# Compiled authorization schema of the built-in applets, generated by `make compiled_schema`.
# Each role lists its permissions grouped by the applet that adds them.
roles:
  course_admin:
    display_name: Course Admin
    description: Can manage the course team and all course settings.
    scopes:
    - course-v1
    icon: null
    hidden: false
    permissions:
      course_authoring:
      - courses.create_files
      - courses.delete_files
      - courses.edit_course_content
      - courses.edit_details
      - courses.edit_files
      - courses.edit_grading_settings
      - courses.edit_schedule
      - courses.export_course
      - courses.export_tags
      - courses.import_course
      - courses.manage_advanced_settings
      - courses.manage_certificates
      - courses.manage_course_team
      - courses.manage_course_updates
      - courses.manage_group_configurations
      - courses.manage_library_updates
      - courses.manage_pages_and_resources
      - courses.manage_tags
      - courses.manage_taxonomies
      - courses.publish_course_content
      - courses.view_advanced_settings
      - courses.view_certificates
      - courses.view_checklists
      - courses.view_course
      - courses.view_course_team
      - courses.view_course_updates
      - courses.view_files
      - courses.view_grading_settings
      - courses.view_group_configurations
      - courses.view_library_updates
      - courses.view_pages_and_resources
      - courses.view_schedule_and_details
      course_team_roles:
      - courses.legacy_instructor_role_permissions
      enrollments:
      - courses.enroll_learners
      - courses.unenroll_learners
      - courses.view_enrollments
      learner_administration:
      - courses.manage_cohorts
      - courses.manage_learner_extensions
      - courses.view_cohorts
      - courses.view_course_info
      - courses.view_learner_extensions
      learner_grading:
      - courses.manage_learner_grading
      - courses.view_gradebook
  course_auditor:
    display_name: Course Auditor
    description: Can view course content and settings, but cannot make changes.
    scopes:
    - course-v1
    icon: null
    hidden: true
    permissions:
      course_authoring:
      - courses.view_advanced_settings
      - courses.view_certificates
      - courses.view_checklists
      - courses.view_course
      - courses.view_course_team
      - courses.view_course_updates
      - courses.view_files
      - courses.view_grading_settings
      - courses.view_group_configurations
      - courses.view_library_updates
      - courses.view_pages_and_resources
      - courses.view_schedule_and_details
  course_beta_tester:
    display_name: Course Beta Tester (legacy)
    description: Legacy course role retained for backward compatibility. Grants the legacy beta tester compatibility permission.
    scopes:
    - course-v1
    icon: null
    hidden: true
    permissions:
      course_team_roles:
      - courses.legacy_beta_tester_permissions
  course_data_researcher:
    display_name: Course Data Researcher (legacy)
    description: Legacy course role retained for backward compatibility. Grants the legacy data researcher compatibility permission.
    scopes:
    - course-v1
    icon: null
    hidden: true
    permissions:
      course_team_roles:
      - courses.legacy_data_researcher_permissions
  course_editor:
    display_name: Course Editor
    description: Can create and edit course content, but cannot publish or change critical course settings.
    scopes:
    - course-v1
    icon: null
    hidden: true
    permissions:
      course_authoring:
      - courses.create_files
      - courses.edit_course_content
      - courses.edit_details
      - courses.edit_files
      - courses.edit_grading_settings
      - courses.manage_course_updates
      - courses.manage_group_configurations
      - courses.manage_library_updates
      - courses.manage_pages_and_resources
      - courses.manage_tags
      - courses.view_advanced_settings
      - courses.view_certificates
      - courses.view_checklists
      - courses.view_course
      - courses.view_course_team
      - courses.view_course_updates
      - courses.view_files
      - courses.view_grading_settings
      - courses.view_group_configurations
      - courses.view_library_updates
      - courses.view_pages_and_resources
      - courses.view_schedule_and_details
  course_limited_staff:
    display_name: Course Limited Staff (legacy)
    description: Legacy course role retained for backward compatibility. Grants the legacy limited staff compatibility permission.
    scopes:
    - course-v1
    icon: null
    hidden: true
    permissions:
      course_team_roles:
      - courses.legacy_limited_staff_role_permissions
  course_staff:
    display_name: Course Staff
    description: Can publish content and manage the course lifecycle in Studio.
    scopes:
    - course-v1
    icon: null
    hidden: false
    permissions:
      course_authoring:
      - courses.create_files
      - courses.delete_files
      - courses.edit_course_content
      - courses.edit_details
      - courses.edit_files
      - courses.edit_grading_settings
      - courses.edit_schedule
      - courses.export_course
      - courses.export_tags
      - courses.import_course
      - courses.manage_advanced_settings
      - courses.manage_certificates
      - courses.manage_course_updates
      - courses.manage_group_configurations
      - courses.manage_library_updates
      - courses.manage_pages_and_resources
      - courses.manage_tags
      - courses.publish_course_content
      - courses.view_advanced_settings
      - courses.view_certificates
      - courses.view_checklists
      - courses.view_course
      - courses.view_course_team
      - courses.view_course_updates
      - courses.view_files
      - courses.view_grading_settings
      - courses.view_group_configurations
      - courses.view_library_updates
      - courses.view_pages_and_resources
      - courses.view_schedule_and_details
      course_team_roles:
      - courses.legacy_staff_role_permissions
      enrollments:
      - courses.enroll_learners
      - courses.unenroll_learners
      - courses.view_enrollments
      learner_administration:
      - courses.manage_cohorts
      - courses.manage_learner_extensions
      - courses.view_cohorts
      - courses.view_course_info
      - courses.view_learner_extensions
      learner_grading:
      - courses.manage_learner_grading
      - courses.view_gradebook
  library_admin:
    display_name: Library Admin
    description: The Library Admin has full control over the library, including managing users, modifying content, and handling publishing workflows. They ensure content is properly maintained and accessible as needed.
    scopes:
    - lib
    icon: null
    hidden: false
    permissions:
      content_libraries:
      - content_libraries.create_library_collection
      - content_libraries.delete_library
      - content_libraries.delete_library_collection
      - content_libraries.edit_library_collection
      - content_libraries.edit_library_content
      - content_libraries.manage_library_tags
      - content_libraries.manage_library_team
      - content_libraries.publish_library_content
      - content_libraries.reuse_library_content
      - content_libraries.view_library
      - content_libraries.view_library_team
  library_author:
    display_name: Library Author
    description: The Library Author is responsible for creating, editing, and publishing content within a library. They can manage tags and collections but cannot delete libraries or manage users.
    scopes:
    - lib
    icon: null
    hidden: false
    permissions:
      content_libraries:
      - content_libraries.create_library_collection
      - content_libraries.delete_library_collection
      - content_libraries.edit_library_collection
      - content_libraries.edit_library_content
      - content_libraries.manage_library_tags
      - content_libraries.publish_library_content
      - content_libraries.reuse_library_content
      - content_libraries.view_library
      - content_libraries.view_library_team
  library_contributor:
    display_name: Library Contributor
    description: The Library Contributor can create and edit content within a library but cannot publish it. They support the authoring process while leaving final publishing to Authors or Admins.
    scopes:
    - lib
    icon: null
    hidden: false
    permissions:
      content_libraries:
      - content_libraries.create_library_collection
      - content_libraries.delete_library_collection
      - content_libraries.edit_library_collection
      - content_libraries.edit_library_content
      - content_libraries.manage_library_tags
      - content_libraries.reuse_library_content
      - content_libraries.view_library
      - content_libraries.view_library_team
  library_user:
    display_name: Library User
    description: The Library User can view and reuse content but cannot edit or delete any resource.
    scopes:
    - lib
    icon: null
    hidden: false
    permissions:
      content_libraries:
      - content_libraries.reuse_library_content
      - content_libraries.view_library
      - content_libraries.view_library_team
permissions:
  content_libraries.create_library_collection:
    applet: content_libraries
    namespace: content_libraries
    name: create_library_collection
    display_name: Create
    description: Create new collections to organize content within the library.
    category_id: library_collection
    scopes:
    - lib
    icon: Plus
  content_libraries.delete_library:
    applet: content_libraries
    namespace: content_libraries
    name: delete_library
    display_name: Delete
    description: Allows users to delete the entire content library.
    category_id: library
    scopes:
    - lib
    icon: Delete
  content_libraries.delete_library_collection:
    applet: content_libraries
    namespace: content_libraries
    name: delete_library_collection
    display_name: Delete
    description: Permanently remove collections from the library.
    category_id: library_collection
    scopes:
    - lib
    icon: Delete
  content_libraries.edit_library_collection:
    applet: content_libraries
    namespace: content_libraries
    name: edit_library_collection
    display_name: Edit
    description: Update the name and contents of existing collections.
    category_id: library_collection
    scopes:
    - lib
    icon: EditOutline
  content_libraries.edit_library_content:
    applet: content_libraries
    namespace: content_libraries
    name: edit_library_content
    display_name: Edit
    description: Create, edit, and delete content items in the library.
    category_id: library_content
    scopes:
    - lib
    icon: EditOutline
  content_libraries.manage_library_tags:
    applet: content_libraries
    namespace: content_libraries
    name: manage_library_tags
    display_name: Manage tags
    description: Create, edit, and delete tags on this library.
    category_id: library
    scopes:
    - lib
    icon: Settings
  content_libraries.manage_library_team:
    applet: content_libraries
    namespace: content_libraries
    name: manage_library_team
    display_name: Manage
    description: Add, change, or remove role assignments for this library from the Roles and Permissions console.
    category_id: library_team
    scopes:
    - lib
    icon: Settings
  content_libraries.publish_library_content:
    applet: content_libraries
    namespace: content_libraries
    name: publish_library_content
    display_name: Publish
    description: Publish individual content items to make them available for reuse in courses.
    category_id: library_content
    scopes:
    - lib
    icon: DownloadDone
  content_libraries.reuse_library_content:
    applet: content_libraries
    namespace: content_libraries
    name: reuse_library_content
    display_name: Reuse
    description: Add published content from this library to a course.
    category_id: library_content
    scopes:
    - lib
    icon: SpinnerIcon
  content_libraries.view_library:
    applet: content_libraries
    namespace: content_libraries
    name: view_library
    display_name: View
    description: See the library in Studio and access its content in read-only mode.
    category_id: library
    scopes:
    - lib
    icon: RemoveRedEye
  content_libraries.view_library_team:
    applet: content_libraries
    namespace: content_libraries
    name: view_library_team
    display_name: View
    description: See the list of users with a role assigned to this library.
    category_id: library_team
    scopes:
    - lib
    icon: RemoveRedEye
  courses.create_files:
    applet: course_authoring
    namespace: courses
    name: create_files
    display_name: Create files
    description: Upload new files and assets to the course.
    category_id: course_files
    scopes:
    - course-v1
    icon: Plus
  courses.delete_files:
    applet: course_authoring
    namespace: courses
    name: delete_files
    display_name: Delete files
    description: Permanently remove files and assets from the course.
    category_id: course_files
    scopes:
    - course-v1
    icon: Delete
  courses.edit_course_content:
    applet: course_authoring
    namespace: courses
    name: edit_course_content
    display_name: Edit course content
    description: Edit the course outline, units, and components.
    category_id: course_access_content
    scopes:
    - course-v1
    icon: EditOutline
  courses.edit_details:
    applet: course_authoring
    namespace: courses
    name: edit_details
    display_name: Edit course details
    description: Update course information including the course summary, pacing, and prerequisites.
    category_id: course_schedule_details
    scopes:
    - course-v1
    icon: EditOutline
  courses.edit_files:
    applet: course_authoring
    namespace: courses
    name: edit_files
    display_name: Edit files
    description: Perform non-destructive actions on files, such as locking or unlocking them.
    category_id: course_files
    scopes:
    - course-v1
    icon: EditOutline
  courses.edit_grading_settings:
    applet: course_authoring
    namespace: courses
    name: edit_grading_settings
    display_name: Edit grading settings
    description: Update the grading configuration for the course, including assignment types and grading scale.
    category_id: course_grading
    scopes:
    - course-v1
    icon: EditOutline
  courses.edit_schedule:
    applet: course_authoring
    namespace: courses
    name: edit_schedule
    display_name: Edit schedule
    description: Update course start and end dates, enrollment dates, and pacing settings.
    category_id: course_schedule_details
    scopes:
    - course-v1
    icon: EditOutline
  courses.enroll_learners:
    applet: enrollments
    namespace: courses
    name: enroll_learners
    display_name: Enroll learners
    description: Enroll learners in the course, individually or in bulk.
    category_id: course_enrollments
    scopes:
    - course-v1
    icon: PersonAdd
  courses.export_course:
    applet: course_authoring
    namespace: courses
    name: export_course
    display_name: Export course
    description: Download the course content as a file for backup or reuse in another platform.
    category_id: course_import_export
    scopes:
    - course-v1
    icon: Upload
  courses.export_tags:
    applet: course_authoring
    namespace: courses
    name: export_tags
    display_name: Export tags
    description: Download the tag data associated with this course.
    category_id: course_import_export
    scopes:
    - course-v1
    icon: Upload
  courses.import_course:
    applet: course_authoring
    namespace: courses
    name: import_course
    display_name: Import course
    description: Import course content from a file. This is a high-privilege action that can overwrite most course content and settings.
    category_id: course_import_export
    scopes:
    - course-v1
    icon: Download
  courses.legacy_beta_tester_permissions:
    applet: course_team_roles
    namespace: courses
    name: legacy_beta_tester_permissions
    display_name: Legacy beta tester permissions
    description: Compatibility action mapping the legacy course beta tester role into the authorization system.
    category_id: course_legacy
    scopes:
    - course-v1
    icon: DrawShapes
  courses.legacy_data_researcher_permissions:
    applet: course_team_roles
    namespace: courses
    name: legacy_data_researcher_permissions
    display_name: Legacy data researcher permissions
    description: Compatibility action mapping the legacy course data researcher role into the authorization system.
    category_id: course_legacy
    scopes:
    - course-v1
    icon: DrawShapes
  courses.legacy_instructor_role_permissions:
    applet: course_team_roles
    namespace: courses
    name: legacy_instructor_role_permissions
    display_name: Legacy instructor permissions
    description: Compatibility action mapping the legacy course instructor role into the authorization system.
    category_id: course_legacy
    scopes:
    - course-v1
    icon: DrawShapes
  courses.legacy_limited_staff_role_permissions:
    applet: course_team_roles
    namespace: courses
    name: legacy_limited_staff_role_permissions
    display_name: Legacy limited staff permissions
    description: Compatibility action mapping the legacy course limited staff role into the authorization system.
    category_id: course_legacy
    scopes:
    - course-v1
    icon: DrawShapes
  courses.legacy_staff_role_permissions:
    applet: course_team_roles
    namespace: courses
    name: legacy_staff_role_permissions
    display_name: Legacy staff permissions
    description: Compatibility action mapping the legacy course staff role into the authorization system.
    category_id: course_legacy
    scopes:
    - course-v1
    icon: DrawShapes
  courses.manage_advanced_settings:
    applet: course_authoring
    namespace: courses
    name: manage_advanced_settings
    display_name: Manage advanced settings
    description: Edit technical course configurations in the Advanced Settings page in Studio.
    category_id: course_advanced_certificates
    scopes:
    - course-v1
    icon: Settings
  courses.manage_certificates:
    applet: course_authoring
    namespace: courses
    name: manage_certificates
    display_name: Manage certificates
    description: Create and edit course certificates, including certificate design and eligibility settings.
    category_id: course_advanced_certificates
    scopes:
    - course-v1
    icon: Settings
  courses.manage_cohorts:
    applet: learner_administration
    namespace: courses
    name: manage_cohorts
    display_name: Manage cohorts
    description: Enable cohorts, create and configure cohorts, and assign or move learners between cohorts manually or through CSV uploads.
    category_id: course_cohorts
    scopes:
    - course-v1
    icon: Settings
  courses.manage_course_team:
    applet: course_authoring
    namespace: courses
    name: manage_course_team
    display_name: Manage course team
    description: Add, change, or remove role assignments for this course from the Roles and Permissions console.
    category_id: course_team_group
    scopes:
    - course-v1
    icon: Settings
  courses.manage_course_updates:
    applet: course_authoring
    namespace: courses
    name: manage_course_updates
    display_name: Manage course updates
    description: Create, edit, and delete course announcements and handouts.
    category_id: course_updates_handouts
    scopes:
    - course-v1
    icon: Settings
  courses.manage_group_configurations:
    applet: course_authoring
    namespace: courses
    name: manage_group_configurations
    display_name: Manage group configurations
    description: Create and manage content groups used to target course content to specific learners.
    category_id: course_team_group
    scopes:
    - course-v1
    icon: Settings
  courses.manage_learner_extensions:
    applet: learner_administration
    namespace: courses
    name: manage_learner_extensions
    display_name: Manage learner extensions
    description: Grant or modify individual learner extensions and reset due dates to the course default.
    category_id: course_learner_extensions
    scopes:
    - course-v1
    icon: Settings
  courses.manage_learner_grading:
    applet: learner_grading
    namespace: courses
    name: manage_learner_grading
    display_name: Manage learner grading
    description: Use grading tools for an individual learner or all learners. Includes viewing learner progress, resetting attempts, rescoring submissions, overriding scores, deleting learner problem state, and checking task status where available.
    category_id: course_learner_grading
    scopes:
    - course-v1
    icon: Settings
  courses.manage_library_updates:
    applet: course_authoring
    namespace: courses
    name: manage_library_updates
    display_name: Manage library updates
    description: Accept or reject pending updates from content libraries linked to this course.
    category_id: course_library_updates
    scopes:
    - course-v1
    icon: Checklist
  courses.manage_pages_and_resources:
    applet: course_authoring
    namespace: courses
    name: manage_pages_and_resources
    display_name: Manage pages & resources
    description: Enable or disable course features such as Discussions, the Wiki, Notes, Calculator, and Live. Create and edit Textbooks and Custom pages, and manage their configurations.
    category_id: course_pages_resources
    scopes:
    - course-v1
    icon: Settings
  courses.manage_tags:
    applet: course_authoring
    namespace: courses
    name: manage_tags
    display_name: Manage tags
    description: Create, edit, and delete tags on this course.
    category_id: course_tags_taxonomies
    scopes:
    - course-v1
    icon: Settings
  courses.manage_taxonomies:
    applet: course_authoring
    namespace: courses
    name: manage_taxonomies
    display_name: Manage taxonomies
    description: Manage taxonomies associated with this course. (Granted to course_admin; not currently surfaced in the admin console.)
    category_id: course_tags_taxonomies
    scopes:
    - course-v1
    icon: LocalOffer
  courses.publish_course_content:
    applet: course_authoring
    namespace: courses
    name: publish_course_content
    display_name: Publish course content
    description: Make course content visible to learners.
    category_id: course_access_content
    scopes:
    - course-v1
    icon: DownloadDone
  courses.unenroll_learners:
    applet: enrollments
    namespace: courses
    name: unenroll_learners
    display_name: Unenroll learners
    description: Remove learners' enrollments from the course.
    category_id: course_enrollments
    scopes:
    - course-v1
    icon: PersonRemove
  courses.view_advanced_settings:
    applet: course_authoring
    namespace: courses
    name: view_advanced_settings
    display_name: View advanced settings
    description: Access the Advanced Settings page in Studio. This covers a wide range of technical course configurations, including proctoring, timed exams, LTI tools, enrollment limits, and custom display options.
    category_id: course_advanced_certificates
    scopes:
    - course-v1
    icon: RemoveRedEye
  courses.view_certificates:
    applet: course_authoring
    namespace: courses
    name: view_certificates
    display_name: View certificates
    description: See the course certificate settings.
    category_id: course_advanced_certificates
    scopes:
    - course-v1
    icon: RemoveRedEye
  courses.view_checklists:
    applet: course_authoring
    namespace: courses
    name: view_checklists
    display_name: View checklists
    description: See the course launch checklist in Studio.
    category_id: course_other
    scopes:
    - course-v1
    icon: RemoveRedEye
  courses.view_cohorts:
    applet: learner_administration
    namespace: courses
    name: view_cohorts
    display_name: View cohorts
    description: View course cohorts, their configuration, and their members.
    category_id: course_cohorts
    scopes:
    - course-v1
    icon: RemoveRedEye
  courses.view_course:
    applet: course_authoring
    namespace: courses
    name: view_course
    display_name: View course
    description: See the course in the Studio home and access the course outline in read-only mode. Includes the "View Live" option to preview the course as a learner in the LMS.
    category_id: course_access_content
    scopes:
    - course-v1
    icon: RemoveRedEye
  courses.view_course_info:
    applet: learner_administration
    namespace: courses
    name: view_course_info
    display_name: View course info
    description: View general course information and enrollment counts.
    category_id: course_information
    scopes:
    - course-v1
    icon: RemoveRedEye
  courses.view_course_team:
    applet: course_authoring
    namespace: courses
    name: view_course_team
    display_name: View course team
    description: See the list of users with a role assigned to this course.
    category_id: course_team_group
    scopes:
    - course-v1
    icon: RemoveRedEye
  courses.view_course_updates:
    applet: course_authoring
    namespace: courses
    name: view_course_updates
    display_name: View course updates
    description: See course announcements and handouts visible to learners.
    category_id: course_updates_handouts
    scopes:
    - course-v1
    icon: RemoveRedEye
  courses.view_enrollments:
    applet: enrollments
    namespace: courses
    name: view_enrollments
    display_name: View enrollments
    description: View and search course enrollments and check a learner's enrollment status.
    category_id: course_enrollments
    scopes:
    - course-v1
    icon: RemoveRedEye
  courses.view_files:
    applet: course_authoring
    namespace: courses
    name: view_files
    display_name: View files
    description: See the list of files and assets uploaded to the course.
    category_id: course_files
    scopes:
    - course-v1
    icon: RemoveRedEye
  courses.view_gradebook:
    applet: learner_grading
    namespace: courses
    name: view_gradebook
    display_name: View gradebook
    description: View grades for learners enrolled in the course.
    category_id: course_learner_grading
    scopes:
    - course-v1
    icon: RemoveRedEye
  courses.view_grading_settings:
    applet: course_authoring
    namespace: courses
    name: view_grading_settings
    display_name: View grading settings
    description: See the grading configuration for the course, including assignment types and grading scale.
    category_id: course_grading
    scopes:
    - course-v1
    icon: RemoveRedEye
  courses.view_group_configurations:
    applet: course_authoring
