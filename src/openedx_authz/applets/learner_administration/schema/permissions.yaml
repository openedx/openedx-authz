schema_version: "1.0"
priority: 100

# Icons are Paragon icon names (@openedx/paragon/icons).

permission_categories:
  - id: course_learner_extensions
    display_name: Learner extensions
    description: Permissions for viewing and managing individual due date extensions from the Date Extensions tab in the Instructor Dashboard.
    icon: Event
  - id: course_cohorts_content_groups
    display_name: Cohorts & content groups
    description: Permissions for viewing and managing cohorts in the Instructor Dashboard and configuring content groups in Studio.
    icon: Groups

permissions:
  - namespace: courses
    name: view_course_info
    display_name: View course info
    description: View general course information and enrollment counts in the Instructor Dashboard.
    category_id: course_access_content
    scopes:
      - course-v1
    icon: RemoveRedEye
  - namespace: courses
    name: view_learner_extensions
    display_name: View learner extensions
    description: View and search granted learner extensions and their extended due dates.
    category_id: course_learner_extensions
    scopes:
      - course-v1
    icon: RemoveRedEye
  - namespace: courses
    name: manage_learner_extensions
    display_name: Manage learner extensions
    description: Grant or modify individual learner extensions and reset due dates to the course default.
    category_id: course_learner_extensions
    scopes:
      - course-v1
    icon: Settings
  - namespace: courses
    name: view_cohorts
    display_name: View cohorts
    description: View course cohorts, their configuration, and their members.
    category_id: course_cohorts_content_groups
    scopes:
      - course-v1
    icon: RemoveRedEye
  - namespace: courses
    name: manage_cohorts
    display_name: Manage cohorts
    description: Enable cohorts, create and configure cohorts, and assign or move learners between cohorts manually or through CSV uploads.
    category_id: course_cohorts_content_groups
    scopes:
      - course-v1
    icon: Settings
